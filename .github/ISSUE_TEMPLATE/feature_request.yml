name: Feature request
description: Suggest a change or an option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation that is awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Podium to do
    validations:
      required: true
  - type: textarea
    id: apple
    attributes:
      label: How Apple's Stage Manager handles it
      description: If you know, say what it does in the same situation.
